{% set python_min = "3.10" %}
{% set name = "txl-local-contents" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_local_contents-{{ version }}.tar.gz
  sha256: 9599b91df310465f3ed67195cb33a2b7b0b0cf5c232cda4728e6ff875d1246b2

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - anyio >=3.7.0,<5
    - jupyter_ydoc >=3.0.2,<4.0.0

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_local_contents

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_contents
  summary: TXL plugin for local contents
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_contents
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
